name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: ./.github/actions/pnpm-install
        with:
          matchday-github-token: ${{ secrets.MATCHDAY_GITHUB_TOKEN }}
      - name: Pull environment variables from Vercel
        run: pnpm dlx vercel env pull .env.local --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Build
        run: pnpm run build
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run type:check
      - name: Format
        run: pnpm run format:check
      - name: Unit tests
        run: pnpm run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      deployments: read
      statuses: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: ./.github/actions/pnpm-install
        with:
          matchday-github-token: ${{ secrets.MATCHDAY_GITHUB_TOKEN }}
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Pull environment variables from Vercel
        run: pnpm dlx vercel env pull .env.local --token=${{ secrets.VERCEL_TOKEN }} --yes
      - name: Wait for Vercel deployment
        uses: vercel/wait-for-deployment-action@0e2b0c5c5cce31f1648108aeec56467187aca037
        id: wait_for_vercel
        with:
          environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.wait_for_vercel.outputs.deployment-url }}
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
